<script>
/* ENGINE-START */
// PodEngine: pure logic, no DOM. Mirrors scripts/power_metrics.py + scripts/tier_rules.py —
// keep semantics in lockstep (scripts/test_engine_parity.js checks this against the Python outputs).
const PodEngine = (() => {

const KEYWORD_PATTERNS = {
  tutors: /search your library for a card/i,
  extra_turns: /extra turn/i,
  board_wipes: /destroy all creatures|damage to each creature|each creature (?:gets|is destroyed)/i,
  single_target_removal: /(?:destroy|exile) target (?:creature|permanent|artifact|enchantment|planeswalker|attacking or blocking creature)/i,
  counterspells: /counter target spell/i,
  stax_effects: /players can't|opponents can't|skip (?:your|their) (?:draw|untap|upkeep)/i,
  mass_land_denial: /destroy all lands|search .* library for .* lands? and (?:exile|put)/i,
  free_spells: /without paying its mana cost|rather than pay|\bcascade\b/i,
  card_advantage: /draw (?:a card|two cards|three cards|cards equal to)/i,
  protection_effects: /hexproof|indestructible|protection from/i,
};
const REMINDER_TEXT_RE = /\([^)]*\)/g;
const FAST_MANA_CMC_MAX = 2;
const FAST_MANA_RE = /add (?:\{[wubrgc0-9]\}|one mana|[a-z]+ mana|\$?\d+ mana)/i;

const PRICE_BANDS = [
  ["price_under_1", p => p < 1],
  ["price_1_5", p => p >= 1 && p < 5],
  ["price_5_10", p => p >= 5 && p < 10],
  ["price_10_20", p => p >= 10 && p < 20],
  ["price_20_30", p => p >= 20 && p < 30],
  ["price_30_plus", p => p >= 30],
];

const OPS = {
  ">=": (a, b) => a >= b, "<=": (a, b) => a <= b,
  ">": (a, b) => a > b, "<": (a, b) => a < b, "==": (a, b) => a === b,
};

// ---- deck stats (port of power_metrics.compute_deck_stats) ----
function computeDeckStats(entries, db) {
  const counter = new Map();
  for (const e of entries) counter.set(e.name, (counter.get(e.name) || 0) + e.quantity);

  let totalPrice = 0, maxCardPrice = 0, pricedQty = 0, landQty = 0, basicQty = 0;
  const cmcValues = [];
  const flagged = {};
  for (const k of Object.keys(KEYWORD_PATTERNS)) flagged[k] = [];
  const gameChangers = [], fastMana = [], unpriced = [];
  const priceBands = {};
  for (const [label] of PRICE_BANDS) priceBands[label] = [];

  for (const [name, qty] of counter) {
    const info = db[name] || {};
    const price = info.price;
    if (price !== undefined && price !== null) {
      totalPrice += price * qty;
      maxCardPrice = Math.max(maxCardPrice, price);
      pricedQty += qty;
      for (const [label, test] of PRICE_BANDS) if (test(price)) { priceBands[label].push([name, qty]); break; }
    } else unpriced.push(name);

    const typeLine = info.type_line || "";
    const oracle = (info.oracle_text || "").replace(REMINDER_TEXT_RE, "");
    const cmc = info.cmc;
    const isLand = typeLine.includes("Land");
    if (isLand) {
      landQty += qty;
      if (typeLine.includes("Basic Land")) basicQty += qty;
    } else {
      if (cmc !== undefined && cmc !== null) {
        for (let i = 0; i < qty; i++) cmcValues.push(cmc);
        if (cmc <= FAST_MANA_CMC_MAX && FAST_MANA_RE.test(oracle)) fastMana.push([name, qty]);
      }
    }
    if (info.game_changer) gameChangers.push([name, qty]);
    for (const [label, re] of Object.entries(KEYWORD_PATTERNS)) {
      if (re.test(oracle)) flagged[label].push([name, qty]);
    }
  }

  const totalCards = [...counter.values()].reduce((a, b) => a + b, 0);
  const stats = {
    total_cards: totalCards,
    unique_cards: counter.size,
    total_price_eur: Math.round(totalPrice * 100) / 100,
    max_card_price_eur: Math.round(maxCardPrice * 100) / 100,
    avg_price_per_card: pricedQty ? Math.round(totalPrice / pricedQty * 100) / 100 : null,
    unpriced_cards: unpriced.length,
    unpriced_names: unpriced,
    land_count: landQty,
    basic_land_count: basicQty,
    nonbasic_land_count: landQty - basicQty,
    avg_cmc: cmcValues.length ? Math.round(cmcValues.reduce((a, b) => a + b, 0) / cmcValues.length * 100) / 100 : null,
    game_changers: gameChangers.reduce((s, [, q]) => s + q, 0),
    fast_mana: fastMana.reduce((s, [, q]) => s + q, 0),
  };
  for (const label of Object.keys(KEYWORD_PATTERNS)) stats[label] = flagged[label].reduce((s, [, q]) => s + q, 0);
  for (const [label] of PRICE_BANDS) stats[label] = priceBands[label].reduce((s, [, q]) => s + q, 0);
  flagged.game_changers = gameChangers;
  flagged.fast_mana = fastMana;
  Object.assign(flagged, priceBands);
  return { stats, flagged };
}

// ---- tier evaluation (port of tier_rules.evaluate_deck) ----
// Violations/flags are structured {id, ...params}; the UI localizes them.
function evaluateDeck(stats, flagged, rules, cardNames) {
  const violations = [], flags = [];
  let points = 0;
  const breakdown = {};
  const driving = {};
  const names = cardNames ? new Set(cardNames)
    : new Set(Object.values(flagged).flat().map(([n]) => n));

  const bans = rules.hard_bans || {};
  const maxPrice = bans.max_card_price_eur;
  if (maxPrice !== undefined) {
    const over = flagged.price_30_plus || [];
    const deckMax = stats.max_card_price_eur;
    if (over.length || (deckMax !== undefined && deckMax > maxPrice)) {
      violations.push({ id: "price_cap", cap: maxPrice, cards: over.map(([n]) => n), deckMax });
      driving.price_30_plus = over;
    }
  }
  for (const [listName, list] of Object.entries(bans.banned_cards || {})) {
    const hits = list.filter(n => names.has(n)).sort();
    if (hits.length) violations.push({ id: "banned", list: listName, cards: hits });
  }
  for (const [dial, spec] of Object.entries(rules.dials)) {
    const value = stats[dial] || 0;
    if (value > spec.hard_max) {
      violations.push({ id: "dial_over", dial, value, max: spec.hard_max });
      driving[dial] = flagged[dial] || [];
    } else if (value > spec.baseline_max) {
      const pts = spec.point_steps[String(value)] || 0;
      points += pts;
      breakdown[dial] = pts;
      driving[dial] = flagged[dial] || [];
    }
    if (spec.flag_if_over_zero && value > 0) {
      flags.push({ id: spec.flag_if_over_zero, dial, cards: (flagged[dial] || []).map(([n]) => n) });
    }
  }
  for (const cond of rules.conditionals || []) {
    if (cond.type === "penalty") {
      if (cond.if_all.every(t => OPS[t.op](stats[t.dial] || 0, t.value))) {
        points += cond.penalty_points;
        breakdown[cond.id] = cond.penalty_points;
        for (const t of cond.if_all) if (!driving[t.dial]) driving[t.dial] = flagged[t.dial] || [];
      }
      continue;
    }
    const pre = cond.if;
    if (OPS[pre.op](stats[pre.dial] || 0, pre.value)) {
      for (const req of cond.then) {
        const actual = stats[req.dial] || 0;
        if (!OPS[req.op](actual, req.value)) {
          violations.push({ id: "conditional", condId: cond.id, ifDial: pre.dial, ifValue: stats[pre.dial] || 0,
            reqDial: req.dial, reqOp: req.op, reqValue: req.value, actual });
          if (!driving[pre.dial]) driving[pre.dial] = flagged[pre.dial] || [];
          if (!driving[req.dial]) driving[req.dial] = flagged[req.dial] || [];
        }
      }
    }
  }
  const tiers = rules.tiers;
  let tier;
  if (violations.length) tier = "above";
  else if (points <= tiers.tier1.max_points) tier = "tier1";
  else if (points <= tiers.tier2.max_points) tier = "tier2";
  else { tier = "above"; violations.push({ id: "budget", points, max: tiers.tier2.max_points }); }
  return { tier, points, breakdown, violations, flags, driving };
}

// ---- decklist / URL parsing ----
const LINE_RE = /^\s*(\d+)\s*x?\s+(.+?)\s*$/;
const SET_SUFFIX_RE = /\s+\(([A-Za-z0-9]{2,6})\)(\s+[\w-★]+)?(\s+\*[FE]\*)?\s*$/;
const HEADER_RE = /^(commander|deck|mainboard|sideboard|maybeboard|considering|companion|tokens?)s?\s*(\(\d+\))?\s*:?$/i;

function detectInput(text) {
  const t = text.trim();
  let m = t.match(/archidekt\.com\/decks\/(\d+)/i);
  if (m) return { kind: "archidekt", id: m[1] };
  if (/moxfield\.com/i.test(t)) return { kind: "moxfield" };
  return { kind: "list" };
}

function parseDecklist(text) {
  const entries = new Map();
  const commanders = [];
  let section = "main";
  for (let raw of text.split(/\r?\n/)) {
    let line = raw.trim();
    if (!line || line.startsWith("#") || line.startsWith("//")) continue;
    const cm = line.match(/^commanders?\s*:\s*(.+)$/i);
    if (cm) { commanders.push(stripLine(cm[1]).name); addEntry(entries, stripLine(cm[1])); continue; }
    const hm = line.match(HEADER_RE);
    if (hm) {
      section = /commander/i.test(hm[1]) ? "commander"
        : /sideboard|maybeboard|considering|token/i.test(hm[1]) ? "skip" : "main";
      continue;
    }
    if (section === "skip") continue;
    const e = stripLine(line);
    if (!e.name) continue;
    if (section === "commander") commanders.push(e.name);
    addEntry(entries, e);
  }
  return { entries: [...entries.entries()].map(([name, quantity]) => ({ name, quantity })), commanders };
}
function stripLine(line) {
  const m = line.match(LINE_RE);
  let qty = 1, name = line;
  if (m) { qty = parseInt(m[1], 10); name = m[2]; }
  name = name.replace(SET_SUFFIX_RE, "").trim();
  return { name, quantity: qty };
}
function addEntry(map, e) { map.set(e.name, (map.get(e.name) || 0) + e.quantity); }

// ---- Scryfall card fetching ----
function cardFromScryfall(c) {
  const faces = c.card_faces && c.card_faces.length ? c.card_faces : null;
  const oracle = c.oracle_text !== undefined && c.oracle_text !== null && c.oracle_text !== ""
    ? c.oracle_text
    : faces ? faces.map(f => f.oracle_text || "").join(" // ") : "";
  const imgs = c.image_uris || (faces && faces[0].image_uris) || {};
  const mana = c.mana_cost !== undefined && c.mana_cost !== "" ? c.mana_cost
    : faces ? (faces[0].mana_cost || "") : "";
  const eur = c.prices && (parseFloat(c.prices.eur) || parseFloat(c.prices.eur_foil)) || null;
  return {
    name: c.name, cmc: c.cmc, mana_cost: mana,
    type_line: c.type_line || (faces ? faces.map(f => f.type_line).join(" // ") : ""),
    oracle_text: oracle,
    colors: c.colors || (faces ? faces.flatMap(f => f.colors || []) : []),
    color_identity: c.color_identity || [],
    price: isNaN(eur) ? null : eur,
    game_changer: !!c.game_changer,
    keywords: c.keywords || [],
    img_art: imgs.art_crop || "", img_normal: imgs.normal || "", img_small: imgs.small || "",
  };
}

async function fetchCards(names, cache, onProgress) {
  const need = names.filter(n => !cache[n]);
  const notFound = [];
  for (let i = 0; i < need.length; i += 75) {
    const batch = need.slice(i, i + 75);
    if (onProgress) onProgress({ done: i, total: need.length });
    const res = await fetch("https://api.scryfall.com/cards/collection", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifiers: batch.map(name => ({ name })) }),
    });
    if (!res.ok) throw new Error("Scryfall " + res.status);
    const data = await res.json();
    for (const c of data.data || []) {
      const card = cardFromScryfall(c);
      cache[card.name] = card;
      // also key by requested (possibly front-face) name
      for (const n of batch) {
        if (!cache[n] && (card.name === n || card.name.startsWith(n + " //") || card.name.split(" // ")[0] === n)) cache[n] = card;
      }
    }
    for (const nf of data.not_found || []) notFound.push(nf.name);
    await sleep(120);
  }
  // fuzzy fallback for renamed/flavor cards
  for (const n of [...notFound]) {
    try {
      const res = await fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(n));
      if (res.ok) {
        cache[n] = cardFromScryfall(await res.json());
        notFound.splice(notFound.indexOf(n), 1);
      }
      await sleep(120);
    } catch (e) { /* keep as not found */ }
  }
  return { notFound };
}

async function fetchCheapest(names, cache, onProgress, isCancelled) {
  const targets = names.filter(n => cache[n] && cache[n].price !== null && cache[n].price >= 1 && !cache[n].cheapest);
  for (let i = 0; i < targets.length; i++) {
    if (isCancelled && isCancelled()) return { done: i, total: targets.length, cancelled: true };
    const n = targets[i];
    if (onProgress) onProgress({ done: i, total: targets.length, card: n });
    try {
      const q = '!"' + n.replace(/"/g, '') + '"';
      const res = await fetch("https://api.scryfall.com/cards/search?unique=prints&order=eur&dir=asc&q=" + encodeURIComponent(q));
      if (res.ok) {
        const data = await res.json();
        let best = null;
        for (const c of data.data || []) {
          for (const p of [parseFloat(c.prices && c.prices.eur), parseFloat(c.prices && c.prices.eur_foil)]) {
            if (!isNaN(p) && (best === null || p < best)) best = p;
          }
        }
        if (best !== null && best < cache[n].price) cache[n].price = best;
      }
      cache[n].cheapest = true;
    } catch (e) { /* leave default price */ }
    await sleep(90);
  }
  if (onProgress) onProgress({ done: targets.length, total: targets.length });
  return { done: targets.length, total: targets.length, cancelled: false };
}

async function fetchArchidekt(id) {
  const res = await fetch("https://archidekt.com/api/decks/" + id + "/");
  if (!res.ok) throw new Error("Archidekt " + res.status);
  const data = await res.json();
  const excluded = new Set((data.categories || []).filter(c => c.includedInDeck === false).map(c => c.name));
  const entries = [];
  const commanders = [];
  for (const c of data.cards || []) {
    const cats = c.categories || [];
    if (cats.some(k => excluded.has(k))) continue;
    const name = (c.card && c.card.oracleCard && c.card.oracleCard.name) || (c.card && c.card.name);
    if (!name) continue;
    entries.push({ name, quantity: c.quantity || 1 });
    if (cats.some(k => /^commander$/i.test(k))) commanders.push(name);
  }
  return { name: data.name || ("Archidekt #" + id), entries, commanders };
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ---- functional categorization (Archidekt-style, heuristic) ----
const CAT_RULES = [
  ["land", c => c.type_line.includes("Land") && !c.type_line.split(" // ")[0].includes("Creature")],
  ["wipe", c => /destroy all creatures|damage to each creature|each creature (?:gets|is destroyed)|exile all creatures|destroy all (?:other )?(?:nonland )?permanents/i.test(c._o)],
  ["ctr", c => /counter target/i.test(c._o)],
  ["ramp", c => /search (?:your|their) library for (?:a|up to \w+|two)?\s?(?:basic )?lands?\b/i.test(c._o)
      || (!c.type_line.includes("Land") && c.cmc <= 4 && FAST_MANA_RE.test(c._o))
      || /put (?:a|that|those|them|it) (?:land|lands)? ?(?:cards? )?onto the battlefield/i.test(c._o) && /land/i.test(c._o)],
  ["tut", c => /search your library for a card/i.test(c._o)],
  ["rem", c => /(?:destroy|exile) target (?:creature|permanent|artifact|enchantment|planeswalker|attacking or blocking creature)/i.test(c._o)
      || /deals? \d+ damage to (?:target creature|target planeswalker|any target)/i.test(c._o)],
  ["burn", c => /deals? (?:\d+|x) damage to (?:any target|each opponent|target player|target opponent|each player)/i.test(c._o)],
  ["eq", c => /\bEquipment\b/.test(c.type_line) || /\bAura\b/.test(c.type_line)],
  ["drain", c => /each opponent loses \d+ life|opponents? lose (?:\d+|x) life/i.test(c._o) || (/loses? \d+ life/i.test(c._o) && /you gain \d+ life/i.test(c._o))],
  ["sac", c => /sacrifice (?:a|another|two|x) (?:creature|artifact|permanent|token)/i.test(c._o)],
  ["tok", c => /create[sd]? .{0,80}\btokens?\b/i.test(c._o)],
  ["life", c => /(?:you )?gain (?:\d+|x|that much) life|\blifelink\b/i.test(c._o)],
  ["rec", c => /return .{0,60} from your graveyard to (?:your hand|the battlefield)/i.test(c._o)],
  ["prot", c => /hexproof|indestructible|protection from|\bward\b|can't be targeted/i.test(c._o)],
  ["draw", c => /draw (?:a card|two cards|three cards|x cards|cards equal to|that many cards)/i.test(c._o)],
  ["mot", c => /whenever you cast|magecraft|prowess/i.test(c._o)],
  ["anthem", c => /creatures you control get \+/i.test(c._o)],
];

function typeLetter(typeLine) {
  const front = typeLine.split(" // ")[0];
  if (front.includes("Land")) return "L";
  if (front.includes("Creature")) return "C";
  if (front.includes("Planeswalker")) return "P";
  if (front.includes("Instant")) return "I";
  if (front.includes("Sorcery")) return "S";
  if (front.includes("Artifact")) return "A";
  if (front.includes("Enchantment")) return "E";
  if (front.includes("Battle")) return "B";
  return "O";
}

function classifyCard(card) {
  const c = { ...card, _o: (card.oracle_text || "").replace(REMINDER_TEXT_RE, "") };
  const tags = [];
  for (const [key, test] of CAT_RULES) { try { if (test(c)) tags.push(key); } catch (e) {} }
  const primary = tags.length ? tags[0] : (c.type_line.includes("Creature") ? "cre" : "oth");
  return { type: typeLetter(card.type_line || ""), cat: primary, tags };
}

// ---- archetype detection ----
function detectArchetype(cards) {
  // cards: [{card, qty, cls}]
  const n = (fn) => cards.reduce((s, x) => s + (fn(x) ? x.qty : 0), 0);
  const o = (re) => cards.reduce((s, x) => s + (re.test((x.card.oracle_text || "")) ? x.qty : 0), 0);
  const tag = (t) => cards.reduce((s, x) => s + (x.cls.tags.includes(t) ? x.qty : 0), 0);
  const nonland = cards.filter(x => x.cls.type !== "L");
  const nlQty = nonland.reduce((s, x) => s + x.qty, 0) || 1;
  const avgCmc = nonland.reduce((s, x) => s + (x.card.cmc || 0) * x.qty, 0) / nlQty;
  const creLow = n(x => x.cls.type === "C" && (x.card.cmc || 0) <= 3);
  const instSorc = n(x => x.cls.type === "I" || x.cls.type === "S");
  const equipOnly = n(x => /\bEquipment\b/.test(x.card.type_line || ""));
  const scores = {
    voltron: (equipOnly + n(x => /\bAura\b/.test(x.card.type_line || ""))) * 1.5 + tag("prot") * 0.5,
    aristocrats: tag("sac") * 2 + tag("drain") * 2 + o(/whenever .{0,40}(?:dies|is put into a graveyard)/i) * 0.7,
    control: tag("ctr") * 2 + tag("wipe") * 1.5 + (avgCmc > 3 ? 2 : 0),
    tokens: tag("tok") * 1.4,
    aggro: (avgCmc < 2.8 ? creLow * 0.7 : 0) + o(/\bhaste\b/i) * 0.5,
    equipment: equipOnly * 2.5,
    lifegain: tag("life") * 1.2,
    spellslinger: (instSorc >= 22 ? instSorc * 0.4 : 0) + o(/whenever you cast (?:an instant|a sorcery|an instant or sorcery|a noncreature)/i) * 2 + o(/magecraft/i) * 2,
    counters: o(/\+1\/\+1 counter/i) * 0.8 + o(/proliferate/i) * 1.5,
    reanimator: o(/return .{0,60}creature .{0,40}graveyard .{0,20}(?:to the )?battlefield/i) * 2.5 + o(/\bmill\b|discard .{0,30}card/i) * 0.5,
  };
  let best = "generic", bestScore = 11; // threshold: below this, call it generic
  for (const [k, v] of Object.entries(scores)) if (v > bestScore) { best = k; bestScore = v; }
  return { key: best, scores };
}

// ---- deck validation ----
function validateDeck(cards, commanders, db, notFound) {
  const issues = [];
  const total = cards.reduce((s, x) => s + x.qty, 0);
  if (total !== 100) issues.push({ id: "count", total });
  for (const x of cards) {
    if (x.qty > 1) {
      const t = x.card.type_line || "";
      const o = x.card.oracle_text || "";
      if (!t.includes("Basic Land") && !/any number of cards named/i.test(o)) {
        issues.push({ id: "singleton", name: x.card.name, qty: x.qty });
      }
    }
  }
  if (commanders && commanders.length) {
    const ci = new Set();
    for (const cn of commanders) { const c = db[cn]; if (c) for (const col of c.color_identity || []) ci.add(col); }
    if (commanders.every(cn => db[cn])) {
      for (const x of cards) {
        const bad = (x.card.color_identity || []).filter(col => !ci.has(col));
        if (bad.length) issues.push({ id: "identity", name: x.card.name, colors: bad });
      }
    }
  }
  for (const n of notFound || []) issues.push({ id: "not_found", name: n });
  return issues;
}

// ---- selftest (mirrors tier_rules.py --selftest) ----
function _fake(over, flaggedOver, names) {
  const dials = ["game_changers","extra_turns","tutors","stax_effects","counterspells","board_wipes",
    "free_spells","fast_mana","mass_land_denial","price_1_5","price_10_20","price_20_30","price_30_plus"];
  const stats = {}; for (const d of dials) stats[d] = 0;
  stats.max_card_price_eur = 5.0;
  Object.assign(stats, over);
  const flagged = {}; for (const d of dials) flagged[d] = [];
  Object.assign(flagged, flaggedOver || {});
  return [stats, flagged, names || null];
}

function runSelfTest(rules) {
  const cases = [
    ["stock precon", _fake({ board_wipes: 2, fast_mana: 6, free_spells: 1 }), "tier1"],
    ["one game changer only", _fake({ game_changers: 1 }), "tier1"],
    ["gc + 5th board wipe = 3pts", _fake({ game_changers: 1, board_wipes: 5 }), "tier2"],
    ["5 counterspells still precon", _fake({ counterspells: 5 }), "tier1"],
    ["20 cards of 1-5 EUR = 1pt", _fake({ price_1_5: 20 }), "tier1"],
    ["25 cards of 1-5 EUR busts hard max", _fake({ price_1_5: 25 }), "above"],
    ["31 EUR card", _fake({ max_card_price_eur: 31.0 }, { price_30_plus: [["Pricy", 1]] }), "above"],
    ["two game changers", _fake({ game_changers: 2 }), "above"],
    ["mass land denial", _fake({ mass_land_denial: 1 }), "above"],
    ["banned fast mana card", _fake({}, null, ["Mana Crypt"]), "above"],
    ["banned turn recursion", _fake({ extra_turns: 1 }, null, ["Nexus of Fate"]), "above"],
    ["tutor + gc conditional", _fake({ tutors: 1, game_changers: 1 }), "above"],
    ["gc + pricey conditional", _fake({ game_changers: 1, price_10_20: 4 }), "above"],
    ["fast mana 9 + free 5 = 1+1+2 penalty pts", _fake({ fast_mana: 9, free_spells: 5 }), "tier2"],
    ["fast mana 12 + free 5 = 4+1+2 pts, top of T2", _fake({ fast_mana: 12, free_spells: 5 }), "tier2"],
    ["fast mana 12 + free 6 = 4+2+2 pts, busted budget", _fake({ fast_mana: 12, free_spells: 6 }), "above"],
    ["fast mana 15 over hard max", _fake({ fast_mana: 15 }), "above"],
    ["budget blowout 2 tutors + 2 pricey", _fake({ tutors: 2, price_20_30: 1 }), "above"],
    ["tier2 spend: 2 pricey 20-30", _fake({ price_20_30: 2 }), "tier2"],
    ["extra turn flagged", _fake({ extra_turns: 1 }), "tier2"],
  ];
  const results = [];
  for (const [label, [stats, flagged, names], expected] of cases) {
    const res = evaluateDeck(stats, flagged, rules, names);
    let pass = res.tier === expected;
    if (label === "extra turn flagged" && !res.flags.length) pass = false;
    results.push({ label, expected, got: res.tier, points: res.points, pass });
  }
  return { pass: results.every(r => r.pass), results };
}

return {
  KEYWORD_PATTERNS, PRICE_BANDS, computeDeckStats, evaluateDeck,
  detectInput, parseDecklist, cardFromScryfall, fetchCards, fetchCheapest, fetchArchidekt,
  classifyCard, typeLetter, detectArchetype, validateDeck, runSelfTest, sleep,
};
})();
if (typeof module !== "undefined") module.exports = PodEngine;
/* ENGINE-END */
</script>

};
let cardCache = {};
try { const raw = JSON.parse(localStorage.getItem('pdc_cards_v1') || '{}');
  if (raw._ts && Date.now() - raw._ts < 30 * 864e5) cardCache = raw.cards || {};
} catch (e) {}
function persistCache(){ try { localStorage.setItem('pdc_cards_v1', JSON.stringify({ _ts: Date.now(), cards: cardCache })); } catch (e) {} }

const state = {
  lang: store.lang, theme: store.theme, sysDark: matchMedia('(prefers-color-scheme: dark)').matches,
  arch: 'auto', grp: 'type', cf: 'all', hl: null, openArch: null,

  result: null,      // {stats, flagged, evalRes, cardsInfo, detected, notFound, validation}
  fetchSt: 'idle', fi: {done:0,total:0,card:''}, copied: false, busy: false, error: null,
};
const T = () => L[state.lang];

// ================= analysis pipeline =================
async function analyze() {
  const text = $('deckText').value;
  const det = PodEngine.detectInput(text);
  if (det.kind === 'moxfield') { state.error = 'mox'; renderInput(); return; }
  state.busy = true; state.error = null; renderInput();
  try {
    let parsed;
    if (det.kind === 'archidekt') {
      try { parsed = await PodEngine.fetchArchidekt(det.id); }
      catch (e) { state.error = 'archErr'; state.busy = false; renderInput(); return; }
    } else {
      parsed = PodEngine.parseDecklist(text);
    }
    if (!parsed.entries.length) { state.busy = false; renderInput(); return; }
    const names = [...new Set(parsed.entries.map(e => e.name))];
    const { notFound } = await PodEngine.fetchCards(names, cardCache, p => {
      state.fi = { done: p.done, total: p.total, card: '' }; renderInput();
    });
    persistCache();
    state.deck = parsed;
    recompute(notFound);
    state.fetchSt = 'idle';
  } catch (e) {
    console.error(e); state.error = 'netErr';
  }
  state.busy = false;
  renderAll();
}

function recompute(notFound) {
  const parsed = state.deck;
  const resolved = parsed.entries.filter(e => cardCache[e.name]);
  const { stats, flagged } = PodEngine.computeDeckStats(resolved, cardCache);
  const evalRes = PodEngine.evaluateDeck(stats, flagged, RULES, resolved.map(e => e.name));
  const cardsInfo = resolved.map(e => ({ card: cardCache[e.name], qty: e.quantity, name: e.name,
    cls: PodEngine.classifyCard(cardCache[e.name]) }));
  const detected = PodEngine.detectArchetype(cardsInfo);
  const validation = PodEngine.validateDeck(cardsInfo, parsed.commanders, cardCache,
    notFound !== undefined ? notFound : (state.result ? state.result.notFound : []));
  state.result = { stats, flagged, evalRes, cardsInfo, detected,
    notFound: notFound !== undefined ? notFound : (state.result ? state.result.notFound : []), validation };
}

let fetchCancelled = false;
async function startCheapest() {
  if (state.fetchSt !== 'idle' || !state.result) return;
  state.fetchSt = 'fetching'; fetchCancelled = false; renderBanner();
  const names = [...new Set(state.deck.entries.map(e => e.name))];
  await PodEngine.fetchCheapest(names, cardCache, p => {
    state.fi = { done: p.done, total: p.total, card: p.card || '' }; renderBanner();
  }, () => fetchCancelled);
  persistCache();
  recompute();
  state.fetchSt = 'done';
  renderAll();
}

// ================= advice (tip) =================
function buildTip() {
  const r = state.result, lang = state.lang, ev = r.evalRes;
  const t1 = RULES.tiers.tier1.max_points, t2 = RULES.tiers.tier2.max_points;
  const entries = Object.entries(ev.breakdown).sort((a, b) => b[1] - a[1]);
  const nameOf = k => EXTRA_PTS[k] ? EXTRA_PTS[k][lang] : dialName(k, lang);
  const listCards = k => (ev.driving[k] || []).slice(0, 3).map(([n]) => n).join(', ');
  if (ev.tier === 'above') {
    const cuts = entries.slice(0, 2).map(([k, p]) => nameOf(k) + ' (−' + p + ' pts: ' + (listCards(k) || '') + ')').join('; ');
    return lang === 'es'
      ? 'Este mazo necesita recortes para sentarse en el pod. Empieza por las violaciones de arriba' + (cuts ? ', y después por lo que más puntos cuesta: ' + cuts : '') + '.'
      : 'This deck needs cuts to sit at the pod. Start with the violations above' + (cuts ? ', then with what costs the most points: ' + cuts : '') + '.';
  }
  if (ev.tier === 'tier2') {
    const need = ev.points - t1;
    const cuts = entries.map(([k, p]) => nameOf(k) + ' (+' + p + ': ' + (listCards(k) || '—') + ')').join('; ');
    return lang === 'es'
      ? 'Tier 2 con ' + ev.points + '/' + t2 + ' puntos. Para bajar a Tier 1 suelta ' + need + ' punto' + (need > 1 ? 's' : '') + ': ' + cuts + '.'
      : 'Tier 2 at ' + ev.points + '/' + t2 + ' points. To drop to Tier 1, shed ' + need + ' point' + (need > 1 ? 's' : '') + ': ' + cuts + '.';
  }
  const margin = t1 - ev.points;
  return lang === 'es'
    ? 'Mazo limpio de Tier 1: ' + ev.points + ' punto' + (ev.points === 1 ? '' : 's') + ' de los ' + t1 + ' permitidos. ' + (margin > 0 ? 'Tienes ' + margin + ' punto' + (margin > 1 ? 's' : '') + ' de margen para una mejora puntual sin salir de Tier 1.' : 'Estás justo en el límite de Tier 1.')
    : 'Clean Tier 1 deck: ' + ev.points + ' point' + (ev.points === 1 ? '' : 's') + ' of the ' + t1 + ' allowed. ' + (margin > 0 ? 'You have ' + margin + ' point' + (margin > 1 ? 's' : '') + ' of headroom for one targeted upgrade without leaving Tier 1.' : 'You are right at the Tier 1 limit.');
}

function badgeFor(name) {
  const r = state.result;
  for (const [dial, label, tone] of BADGE_OF) {
    const spec = RULES.dials[dial];
    if (!spec) continue;
    const inDial = (r.flagged[dial] || []).some(([n]) => n === name);
    if (inDial && ((r.stats[dial] || 0) > spec.baseline_max || dial === 'game_changers')) {
      const bg = tone === 'bad' ? 'var(--badBg)' : tone === 'warn' ? 'var(--warnBg)' : 'var(--border2)';
      const fg = tone === 'bad' ? 'var(--badFg)' : tone === 'warn' ? 'var(--warnFg)' : 'var(--muted)';
      return { label, bg, fg };
    }
  }
  return null;
}

    '<span class="secT" style="font-size:11.5px">' + t.curve + '</span>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap">' + ['all', 'cre', 'draw', 'rem', 'ramp'].map(k =>
      '<button data-cf="' + k + '" style="padding:4px 12px;border-radius:99px;border:1px solid ' + (state.cf === k ? 'var(--text)' : 'var(--border)') + ';background:' + (state.cf === k ? 'var(--text)' : 'transparent') + ';color:' + (state.cf === k ? 'var(--bg)' : 'var(--muted)') + ';font-size:11px;font-weight:600">' + t[k] + '</button>').join('') + '</div></div>' +
    '<div style="display:flex;align-items:flex-end;gap:8px;height:120px">' +
    bins.map((b, i) => '<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:3px">' +
      '<div style="display:flex;flex-direction:column;justify-content:flex-end;border-radius:4px 4px 0 0;overflow:hidden">' +
      segKeys.filter(k => b[k] > 0).map(k => '<div style="height:' + Math.round(b[k] / maxT * 100) + 'px;background:' + SEGC[k] + '"></div>').join('') + '</div>' +
      '<span class="mono" style="font-size:10px;color:var(--muted);text-align:center">' + (i === 7 ? '7+' : i) + '</span></div>').join('') + '</div>' +
    '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);border-top:1px solid var(--border2);padding-top:10px">' +
    ['cre', 'draw', 'rem', 'ramp', 'oth'].map(k => '<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:' + SEGC[k] + '"></span>' + t[k] + '</span>').join('') +
    '<span class="mono" style="margin-left:auto">' + t.avg + ' ' + avgCmc + ' · ' + nlQty + ' ' + t.nonlands + '</span></div></div>';
  // pips
  const pipCnt = { W: 0, U: 0, B: 0, R: 0, G: 0 };
  for (const x of r.cardsInfo) {
    const mana = x.card.mana_cost || '';
    for (const ch of mana.replace(/[{}/]/g, '')) if (pipCnt[ch] !== undefined) pipCnt[ch] += x.qty;
  }
  const pipTot = Object.values(pipCnt).reduce((a, b) => a + b, 0) || 1;
  html += '<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px">' +
    '<span class="secT" style="font-size:11.5px">' + t.pips + '</span><div style="display:flex;flex-direction:column;gap:9px;font-size:12px">' +
    ['W', 'U', 'B', 'R', 'G'].filter(k => pipCnt[k] > 0).map(k => {
      const pc = Math.round(pipCnt[k] / pipTot * 100);
      const bar = k === 'W' ? 'oklch(0.8 0.07 95)' : PIP[k];
      return '<div style="display:flex;align-items:center;gap:9px"><div style="width:15px;height:15px;border-radius:50%;background:' + PIP[k] + ';border:1px solid var(--muted);flex:none"></div>' +
        '<div style="flex:1;height:8px;background:var(--track);border-radius:4px"><div style="width:' + pc + '%;height:100%;background:' + bar + ';border-radius:4px"></div></div>' +
        '<span class="mono" style="font-size:10.5px;color:var(--muted);width:36px;text-align:right">' + pc + '%</span></div>';
    }).join('') + '</div></div>';
  // price bands
  const bandDefs = [['<€1', p => p < 1, 'oklch(0.7 0.11 150)'], ['€1–5', p => p >= 1 && p < 5, 'oklch(0.75 0.1 85)'], ['€5–10', p => p >= 5 && p < 10, 'oklch(0.72 0.11 70)'], ['€10–20', p => p >= 10 && p < 20, 'oklch(0.68 0.12 55)'], ['€20–30', p => p >= 20 && p < 30, 'oklch(0.64 0.13 40)'], ['>€30', p => p >= 30, 'oklch(0.6 0.15 25)']];
  const bandCounts = bandDefs.map(([, f]) => r.cardsInfo.filter(x => x.card.price != null && f(x.card.price)).reduce((s, x) => s + x.qty, 0));
  const maxB = Math.max(...bandCounts, 1);
  html += '<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px">' +
    '<span class="secT" style="font-size:11.5px">' + t.bands + '</span><div class="mono" style="display:flex;flex-direction:column;gap:9px;font-size:11px;color:var(--muted)">' +
    bandDefs.map(([lbl, , c], i) => '<div style="display:flex;align-items:center;gap:9px"><span style="width:48px">' + lbl + '</span>' +
      '<div style="flex:1;height:8px;background:var(--track);border-radius:4px"><div style="width:' + Math.round(bandCounts[i] / maxB * 100) + '%;height:100%;background:' + c + ';border-radius:4px"></div></div>' +
      '<span style="width:26px;text-align:right">' + bandCounts[i] + '</span></div>').join('') + '</div></div>';
  $('curveWrap').innerHTML = html;
  for (const b of $('curveWrap').querySelectorAll('[data-cf]')) b.onclick = () => { state.cf = b.dataset.cf; renderCurve(); };
}

function renderGuide() {
  const t = T(), lang = state.lang;
  $('guideT').textContent = t.guide;
  $('guideBody').innerHTML = ARCH.map(a => {
    const open = state.openArch === a.k;
    return '<div style="border-bottom:1px solid var(--border2)">' +
      '<div data-arch="' + a.k + '" style="display:flex;justify-content:space-between;align-items:center;padding:13px 22px;font-size:14px;cursor:pointer">' +
      '<span style="font-weight:600">' + esc(a.name[lang]) + '</span><span style="color:var(--muted);font-size:16px">' + (open ? '−' : '＋') + '</span></div>' +
      (open ? '<div style="padding:0 22px 16px;display:flex;flex-direction:column;gap:10px;background:var(--panel2)">' +
        '<div style="font-size:13px;line-height:1.6;max-width:720px;padding-top:12px">' + a.desc[lang] + '</div>' +
        '<div style="font-size:12.5px;line-height:1.6;color:var(--muted);max-width:720px">' + a.how[lang] + '</div>' +
        '<div class="mono" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:10.5px">' +
        '<span style="color:var(--muted)">' + t.slots + '</span>' +
        a.slots[lang].map(s => '<span style="border:1px solid var(--border);border-radius:99px;padding:3px 11px">' + esc(s) + '</span>').join('') +
        '<button data-build="' + a.k + '" style="background:var(--accent);color:var(--accentFg);border:none;border-radius:99px;padding:5px 14px;font:600 11px \'IBM Plex Sans\',sans-serif">' + t.build + '</button></div></div>' : '') + '</div>';
  }).join('');
  for (const h of $('guideBody').querySelectorAll('[data-arch]'))
    h.onclick = () => { state.openArch = state.openArch === h.dataset.arch ? null : h.dataset.arch; renderGuide(); };
  for (const b of $('guideBody').querySelectorAll('[data-build]'))
    b.onclick = (e) => { e.stopPropagation(); state.arch = b.dataset.build; state.openArch = null; $('archSel').value = state.arch;
      renderGuide(); if (state.result) { renderSummary(); renderComp(); } };
}

function copyReport() {
  if (!state.result) return;
  const t = T(), lang = state.lang, ev = state.result.evalRes;
  const lines = ['La guía del Yoryi — ' + t.power,
    t.tierWord + ': ' + t[ev.tier],
    t.pts + ': ' + ev.points + ' / ' + RULES.tiers.tier2.max_points,
    t.price + ': €' + Math.round(state.result.stats.total_price_eur),
    t.cardsN + ': ' + state.result.stats.total_cards,
    t.archetype + ': ' + archName()];
  for (const v of ev.violations) lines.push('✕ ' + (v.id === 'conditional' ? MSG.conditional[v.condId][lang](v) : MSG[v.id][lang](v)));
  for (const f of ev.flags) lines.push('⚠ ' + (MSG['flag_' + f.id] ? MSG['flag_' + f.id][lang](f) : f.id));
  for (const [k, p] of Object.entries(ev.breakdown)) lines.push('· ' + (EXTRA_PTS[k] ? EXTRA_PTS[k][lang] : dialName(k, lang)) + ': +' + p + ' pts');
  try { navigator.clipboard.writeText(lines.join('\n')); } catch (e) {}
  state.copied = true; renderHeader();
  setTimeout(() => { state.copied = false; renderHeader(); }, 1600);
}

function renderAll() {
  applyTheme(); renderHeader(); renderInput(); renderGuide();
  const t = T();
  $('emptyT').textContent = t.emptyT; $('emptyX').textContent = t.emptyX;
  $('footer').textContent = t.footer;
  const has = !!state.result;
  $('empty').style.display = has ? 'none' : '';
  $('resultWrap').style.display = has ? '' : 'none';
  if (has) { renderSummary(); renderBanner(); renderValidation(); renderPower(); renderComp(); renderBrowser(); renderCurve(); }
}

// ================= boot =================
window.addEventListener('DOMContentLoaded', () => {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { state.sysDark = e.matches; applyTheme(); });
  $('themeBtn').onclick = () => { const eff = state.theme ? state.theme === 'dark' : state.sysDark;
    state.theme = eff ? 'light' : 'dark'; store.theme = state.theme; applyTheme(); };
  $('esBtn').onclick = () => { state.lang = 'es'; store.lang = 'es'; renderAll(); };
  $('enBtn').onclick = () => { state.lang = 'en'; store.lang = 'en'; renderAll(); };
  $('copyBtn').onclick = copyReport;
  $('analyzeBtn').onclick = analyze;
  $('archSel').onchange = (e) => { state.arch = e.target.value; if (state.result) { renderSummary(); renderComp(); } };
  $('deckText').oninput = () => { state.error = null; renderInput(); };
  $('gtBtn').onclick = () => { state.grp = 'type'; renderBrowser(); };
  $('gcBtn').onclick = () => { state.grp = 'cat'; renderBrowser(); };
  const st = PodEngine.runSelfTest(RULES);
  if (!st.pass) console.warn('PodEngine selftest FAILED', st.results.filter(r => !r.pass));
  renderAll();
});
})(); }
</script>

<div style="min-height:100vh;display:flex;flex-direction:column">
<div style="position:relative;overflow:hidden;background:var(--panel);border-bottom:1px solid var(--border)">
  <div style="position:absolute;right:-40px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,oklch(0.55 0.09 260 / .22),transparent 65%)"></div>
  <div style="position:absolute;right:150px;top:-100px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,oklch(0.5 0.1 300 / .16),transparent 65%)"></div>
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:14px 20px">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:44px;border-radius:11px;background:conic-gradient(oklch(0.85 0.06 95),oklch(0.65 0.11 240),oklch(0.45 0.05 300),oklch(0.6 0.16 30),oklch(0.6 0.13 150),oklch(0.85 0.06 95));display:grid;place-items:center;flex:none">
        <div class="mono" style="width:35px;height:35px;border-radius:8px;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:20px">Y</div>
      </div>
      <div style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-size:19px;font-weight:700;letter-spacing:-0.01em">La guía del Yoryi</span>
        <span id="appTag" class="mono" style="font-size:10px;color:var(--muted);letter-spacing:0.14em">POD DECK CHECKER</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button id="copyBtn" style="border:1px solid var(--border);background:transparent;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap">⧉</button>
      <div style="display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;font-size:12px;font-weight:600">
        <button id="enBtn" style="border:none;padding:6px 11px">EN</button>
        <button id="esBtn" style="border:none;padding:6px 11px">ES</button>
      </div>
      <button id="themeBtn" title="Tema" style="width:32px;height:32px;border:1px solid var(--border);background:transparent;border-radius:7px;display:grid;place-items:center;font-size:14px">◐</button>
    </div>
  </div>
</div>
<main style="width:100%;max-width:1180px;margin:0 auto;padding:24px 20px 12px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box">
  <div class="panel" style="padding:20px;display:flex;flex-direction:column;gap:12px">
    <div id="inputTitle" class="secT">ANALIZAR MAZO</div>
    <textarea id="deckText" rows="6" class="mono" style="border:1px solid var(--border);border-radius:8px;background:var(--panel2);padding:12px 14px;font-size:12.5px;resize:vertical;min-height:72px"></textarea>
    <div id="inputNotice" style="display:none;background:var(--warnBg);border:1px solid var(--warnBd);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--warnFg)"></div>

      <span id="samples" style="display:contents"></span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="flex:1;min-width:220px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-size:13px">
        <span id="archLabel" style="color:var(--muted);white-space:nowrap"></span>
        <select id="archSel" style="flex:1;border:none;background:transparent;padding:10px 0;font-weight:600;cursor:pointer"></select>
      </label>
      <button id="analyzeBtn" style="background:var(--accent);color:var(--accentFg);border:none;font-weight:600;font-size:14.5px;padding:11px 30px;border-radius:8px"></button>
    </div>
  </div>

  <div id="empty" style="border:1.5px dashed var(--border);border-radius:12px;padding:44px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
    <div style="display:flex;gap:4px;padding-bottom:6px">
      <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.93 0.05 95);border:1.5px solid var(--muted)"></div>
      <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.7 0.11 240);border:1.5px solid var(--muted)"></div>
      <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.35 0.03 300);border:1.5px solid var(--muted)"></div>
      <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.6 0.17 30);border:1.5px solid var(--muted)"></div>
      <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.62 0.13 150);border:1.5px solid var(--muted)"></div>
    </div>
    <div id="emptyT" style="font-size:16px;font-weight:700"></div>
    <div id="emptyX" style="font-size:13px;color:var(--muted);max-width:420px"></div>
  </div>

  <div id="resultWrap" style="display:none;flex-direction:column;gap:20px">
    <div id="summary" style="display:flex;gap:14px;align-items:stretch;flex-wrap:wrap"></div>
    <div id="banner"></div>
    <div id="validation" style="display:none"></div>
    <div id="power" class="panel" style="padding:20px 22px;display:flex;flex-direction:column;gap:2px"></div>
    <div id="comp" style="background:var(--compBg);border:1px solid var(--compBd);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px"></div>
    <div class="panel" style="padding:20px 22px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span id="browserT" class="secT"></span>
        <div style="display:flex;align-items:center;gap:8px">
          <span id="groupByLbl" style="font-size:11.5px;color:var(--muted)"></span>
          <div style="display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;font-size:11.5px;font-weight:600">
            <button id="gtBtn" style="border:none;padding:6px 13px"></button>
            <button id="gcBtn" style="border:none;padding:6px 13px"></button>
          </div>
        </div>
      </div>
      <div id="groups" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start"></div>
    </div>
    <div id="curveWrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"></div>
  </div>

  <div class="panel" style="overflow:hidden">
    <div id="guideT" class="secT" style="padding:15px 22px;border-bottom:1px solid var(--border)"></div>
    <div id="guideBody"></div>
  </div>
</main>
<div id="footer" class="mono" style="text-align:center;font-size:11px;color:var(--faint);padding:10px 20px 28px"></div>
