<script>/* pre-paint theme: keep in sync with js/ui/header.js applyTheme() */
if (localStorage.getItem('pdc_theme') ? localStorage.getItem('pdc_theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');</script>
<script>/* module-cache recovery. sw.js makes every same-origin fetch revalidate
against the network, so one reload through it repairs a mixed-version module
graph (stale i18n.js next to a fresh tabbar.js after a deploy). This hook
forces that ONE reload — guarded by sessionStorage against loops — either
when a module throws at load time (below) or when boot detects a missing
critical i18n key (main.js). */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
window.__pdcRecover = function () {
  try {
    if (sessionStorage.getItem('pdc_recovered')) return false;
    sessionStorage.setItem('pdc_recovered', '1');
  } catch (e) { return false; }
  var go = function () { go = function () {}; location.reload(); };
  if ('serviceWorker' in navigator && !navigator.serviceWorker.controller) {
    /* first visit: wait for the SW to take control so the reload is served
       network-first; time-boxed in case registration fails */
    var tm = setTimeout(function () { go(); }, 2000);
    navigator.serviceWorker.ready.then(function () { clearTimeout(tm); go(); },
      function () { clearTimeout(tm); go(); });
  } else go();
  return true;
};
window.addEventListener('error', function (e) {
  var src = e.filename || (e.target && e.target.src) || '';
  if (/\/js\//.test(String(src))) window.__pdcRecover();
}, true);
</script>

    </div>

<main id="mainContent" class="main" tabindex="-1">

  <div class="tab-row"><div id="tabbar" class="tabbar" role="tablist"></div></div>

        <p id="heroX" class="hero-sub"></p>
        <p id="heroNotice" class="hero-notice" role="alert" hidden></p>
        <button id="heroCta" type="button" class="hero-cta"></button>
      </div>
      <div class="hero-scene" aria-hidden="true"><div id="heroRing" class="hero-ring"></div></div>
      <p id="heroScroll" class="hero-scroll" aria-hidden="true"></p>
    </div>
  </section>

  <div id="tab-load" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-load">
    <div class="load">
      <div class="load-head">
        <h2 id="loadT" class="load-title"></h2>
        <p id="loadSub" class="load-sub"></p>
      </div>
      <div class="input-panel">
        <textarea id="deckText" rows="10" class="deck-input"></textarea>
        <div id="inputNotice" class="input-notice" hidden></div>
        <div class="load-actions">
          <button id="analyzeBtn" class="btn-primary"></button>
          <label class="arch-field">
            <span id="archLabel"></span>
            <select id="archSel" class="arch-select"></select>
          </label>
          <label class="arch-field">
            <span id="podLabel"></span>
            <select id="podSel" class="arch-select"></select>
          </label>
        </div>
      </div>
      <div class="chips-row">
        <span id="tryLabel" class="lbl-muted"></span>
        <span id="samples" class="chip-row"></span>
      </div>
      <div class="controls-row">
        <button id="tableModeBtn" type="button" class="link-btn"></button>
        <button id="emptyPod" type="button" class="link-btn"></button>
      </div>
    </div>
    <div id="tableMode" hidden></div>
  </div>

  <!-- Informe: one view at a time. The point budget alone decides who is in the pod; Wizards'
       brackets, the power level and the card values are separate readings of the same deck. -->
  <div id="tab-informe" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-informe">
    <div id="reportStage" class="report-stage" aria-hidden="true"></div>
    <div id="view-summary" class="view">
      <div id="verdict"></div>
      <div id="commanderPanel"></div>
      <div id="validation" hidden></div>
    </div>
    <div id="view-deck" class="view"></div>
    <div id="view-points" class="view">
      <section id="sec-plan" class="report-part" aria-labelledby="partPlanT">
        <div class="part-head"><h2 id="partPlanT" class="part-title"></h2></div>
        <div id="tips" class="stack-16">
          <div id="tipsMain"></div>
          <div id="tipsUp" class="panel panel-pad-lg" aria-live="polite"></div>
          <details class="panel adv-fold"><summary id="tipsCompT"></summary><div id="tipsComp" class="panel-pad-lg" aria-live="polite"></div></details>
        </div>
      </section>
      <section id="sec-points" class="report-part" aria-labelledby="partPodT">
        <div class="part-head"><div><h2 id="partPodT" class="part-title"></h2><p id="partPodX" class="part-sub"></p></div></div>
        <div id="power" class="panel power-panel"></div>

    </div>
    <div id="view-bracket" class="view">
      <section class="report-part" aria-labelledby="partBrT">
        <div class="part-head"><div><h2 id="partBrT" class="part-title"></h2><p id="partBrX" class="part-sub"></p></div></div>
        <div id="bracket"></div>
      </section>
    </div>
    <div id="view-combos" class="view">
      <div id="combos"></div>
    </div>
    <div id="view-power" class="view">
      <section class="report-part" aria-labelledby="partPfT">
        <div class="part-head"><div><h2 id="partPfT" class="part-title"></h2><p id="partPfX" class="part-sub"></p></div></div>
        <div id="profile"></div>
      </section>
    </div>
    <div id="view-mana" class="view">
      <div id="manaReport"></div>
      <div id="curveWrap" class="curve-wrap"></div>
      <div id="rampPanel" class="panel panel-pad"></div>
      <div id="comp" class="comp-panel"></div>
      <div id="handPanel" class="panel panel-pad-lg"></div>
    </div>
    <div id="view-web" class="view">
      <div id="web"></div>
    </div>
    <section id="editBar" class="edit-bar panel" hidden></section>
  </div>

  <div id="tab-decks" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-decks">
    <div id="decksPanel"></div>
  </div>

  <div id="tab-pod" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-pod">
