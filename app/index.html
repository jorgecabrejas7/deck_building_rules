<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pod Deck Checker — La guía del Yoryi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
<div style="position:relative;overflow:hidden;background:var(--panel);border-bottom:1px solid var(--border)">
  <div style="position:absolute;right:-40px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,oklch(0.55 0.09 260 / .22),transparent 65%)"></div>
  <div style="position:absolute;right:150px;top:-100px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,oklch(0.5 0.1 300 / .16),transparent 65%)"></div>
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:14px 20px">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:44px;border-radius:11px;background:conic-gradient(oklch(0.85 0.06 95),oklch(0.65 0.11 240),oklch(0.45 0.05 300),oklch(0.6 0.16 30),oklch(0.6 0.13 150),oklch(0.85 0.06 95));display:grid;place-items:center;flex:none">
        <div class="mono" style="width:35px;height:35px;border-radius:8px;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:20px">Y</div>
      </div>
      <div style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-size:19px;font-weight:700;letter-spacing:-0.01em">La guía del Yoryi</span>
        <span id="appTag" class="mono" style="font-size:10px;color:var(--muted);letter-spacing:0.14em">POD DECK CHECKER</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button id="copyBtn" style="border:1px solid var(--border);background:transparent;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap">⧉</button>
      <button id="howBtn" style="border:1px solid var(--accent);background:transparent;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap">?</button>
      <div style="display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;font-size:12px;font-weight:600">
        <button id="enBtn" style="border:none;padding:6px 11px">EN</button>
        <button id="esBtn" style="border:none;padding:6px 11px">ES</button>
      </div>
      <button id="themeBtn" title="Tema" style="width:32px;height:32px;border:1px solid var(--border);background:transparent;border-radius:7px;display:grid;place-items:center;font-size:14px">◐</button>
    </div>
  </div>
</div>
<main style="width:100%;max-width:1180px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box">
  <div id="stickyWrap" style="display:none;position:sticky;top:0;z-index:60;background:var(--bg);padding:8px 0 10px;flex-direction:column;gap:10px;border-bottom:1px solid var(--border)">
    <div id="summary" style="display:flex;gap:12px;align-items:stretch;flex-wrap:wrap"></div>
    <div id="banner"></div>
  </div>

  <nav id="tabbar" style="display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0"></nav>

  <div id="tab-load" style="display:flex;flex-direction:column;gap:16px">
    <div class="panel" style="padding:20px;display:flex;flex-direction:column;gap:12px">
      <div id="inputTitle" class="secT">ANALIZAR MAZO</div>
      <textarea id="deckText" rows="10" class="mono" style="border:1px solid var(--border);border-radius:8px;background:var(--panel2);padding:12px 14px;font-size:12.5px;resize:vertical;min-height:120px"></textarea>
      <div id="inputNotice" style="display:none;background:var(--warnBg);border:1px solid var(--warnBd);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--warnFg)"></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span id="tryLabel" style="font-size:12px;color:var(--muted)"></span>
        <span id="samples" style="display:contents"></span>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label style="flex:1;min-width:220px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-size:13px">
          <span id="archLabel" style="color:var(--muted);white-space:nowrap"></span>
          <select id="archSel" style="flex:1;border:none;background:transparent;padding:10px 0;font-weight:600;cursor:pointer"></select>
        </label>
        <button id="analyzeBtn" style="background:var(--accent);color:var(--accentFg);border:none;font-weight:600;font-size:14.5px;padding:11px 30px;border-radius:8px"></button>
        <button id="tableModeBtn" style="border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:10px 18px;border-radius:8px"></button>
      </div>
    </div>
    <div id="validation" style="display:none"></div>
    <div id="tableMode" style="display:none"></div>
    <div id="empty" style="border:1.5px dashed var(--border);border-radius:12px;padding:44px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
      <div style="display:flex;gap:4px;padding-bottom:6px">
        <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.93 0.05 95);border:1.5px solid var(--muted)"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.7 0.11 240);border:1.5px solid var(--muted)"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.35 0.03 300);border:1.5px solid var(--muted)"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.6 0.17 30);border:1.5px solid var(--muted)"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:oklch(0.62 0.13 150);border:1.5px solid var(--muted)"></div>
      </div>
      <div id="emptyT" style="font-size:16px;font-weight:700"></div>
      <div id="emptyX" style="font-size:13px;color:var(--muted);max-width:420px"></div>
    </div>
  </div>

  <div id="tab-power" style="display:none;flex-direction:column;gap:16px">
    <div id="power" class="panel" style="padding:20px 22px;display:flex;flex-direction:column;gap:2px"></div>
  </div>

  <div id="tab-analysis" style="display:none;flex-direction:column;gap:16px">
    <div id="comp" style="background:var(--compBg);border:1px solid var(--compBd);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px"></div>
    <div class="panel" style="padding:20px 22px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span id="browserT" class="secT"></span>
        <div style="display:flex;align-items:center;gap:8px">
          <span id="groupByLbl" style="font-size:11.5px;color:var(--muted)"></span>
          <div style="display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;font-size:11.5px;font-weight:600">
            <button id="gtBtn" style="border:none;padding:6px 13px"></button>
            <button id="gcBtn" style="border:none;padding:6px 13px"></button>
          </div>
        </div>
      </div>
      <div id="groups" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start"></div>
    </div>
    <div id="curveWrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"></div>
    <div id="rampPanel" class="panel" style="padding:20px 22px;display:flex;flex-direction:column;gap:12px"></div>
    <div id="handPanel" class="panel" style="padding:20px 22px;display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <div id="tab-tips" style="display:none;flex-direction:column;gap:16px">
    <div id="tips" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>

  <div id="tab-guide" style="display:none;flex-direction:column;gap:16px">
    <div class="panel" style="overflow:hidden">
      <div id="guideT" class="secT" style="padding:15px 22px;border-bottom:1px solid var(--border)"></div>
      <div id="guideBody"></div>
    </div>
  </div>
</main>
<div id="footer" class="mono" style="text-align:center;font-size:11px;color:var(--faint);padding:10px 20px 28px"></div>
<div id="howModal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);overflow:auto;padding:30px 16px;box-sizing:border-box">
  <div id="howBody" style="max-width:780px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:26px 30px;position:relative"></div>
</div>
<div id="textPop" style="display:none;position:fixed;max-width:320px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 15px;font-size:12.5px;line-height:1.6;box-shadow:0 12px 34px rgba(0,0,0,.35);z-index:100;pointer-events:none"></div>
<div id="popover" style="display:none;position:fixed;width:264px;height:368px;border-radius:13px;box-shadow:0 18px 50px rgba(0,0,0,.45);z-index:99;pointer-events:none;background:var(--panel) center/cover no-repeat"></div>
</div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
