<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pod Deck Checker — La guía del Yoryi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/mobile.css">
</head>
<body>
<script>/* pre-paint theme: keep in sync with js/ui/header.js applyTheme() */
if (localStorage.getItem('pdc_theme') ? localStorage.getItem('pdc_theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');</script>
<script>/* module-cache recovery. sw.js makes every same-origin fetch revalidate
against the network, so one reload through it repairs a mixed-version module
graph (stale i18n.js next to a fresh tabbar.js after a deploy). This hook
forces that ONE reload — guarded by sessionStorage against loops — either
when a module throws at load time (below) or when boot detects a missing
critical i18n key (main.js). */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
window.__pdcRecover = function () {
  try {
    if (sessionStorage.getItem('pdc_recovered')) return false;
    sessionStorage.setItem('pdc_recovered', '1');
  } catch (e) { return false; }
  var go = function () { go = function () {}; location.reload(); };
  if ('serviceWorker' in navigator && !navigator.serviceWorker.controller) {
    /* first visit: wait for the SW to take control so the reload is served
       network-first; time-boxed in case registration fails */
    var tm = setTimeout(function () { go(); }, 2000);
    navigator.serviceWorker.ready.then(function () { clearTimeout(tm); go(); },
      function () { clearTimeout(tm); go(); });
  } else go();
  return true;
};
window.addEventListener('error', function (e) {
  var src = e.filename || (e.target && e.target.src) || '';
  if (/\/js\//.test(String(src))) window.__pdcRecover();
}, true);
</script>
<div class="page">
<div class="hero">
  <div class="hero-glow1"></div>
  <div class="hero-glow2"></div>
  <div class="hero-inner">
    <div class="brand">
      <div class="brand-logo"><div class="brand-logo-inner mono">Y</div></div>
      <div class="brand-text">
        <h1 class="brand-title">La guía del Yoryi</h1>
        <span id="appTag" class="brand-tag mono">POD DECK CHECKER</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="copyBtn" class="btn-outline">⧉</button>
      <button id="howBtn" class="btn-outline-accent">?</button>
      <div class="seg-toggle">
        <button id="esBtn">ES</button>
        <button id="enBtn">EN</button>
      </div>
      <button id="themeBtn" class="icon-btn" title="Tema">◐</button>
    </div>
  </div>
</div>
<main class="main">
  <div id="stickySentinel" class="sticky-sentinel"></div>
  <div id="stickyWrap" class="sticky-wrap">
    <div id="summary" class="summary-row"></div>
    <nav id="tabbar" class="tabbar" role="tablist"></nav>
  </div>

  <div id="banner" aria-live="polite"></div>

  <div id="tab-load" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-load">
    <div class="panel input-panel">
      <h2 id="inputTitle" class="secT secT-lg">ANALIZAR MAZO</h2>
      <textarea id="deckText" rows="10" class="mono deck-input"></textarea>
      <div id="inputNotice" class="input-notice"></div>
      <div class="chips-row">
        <span id="tryLabel" class="lbl-muted"></span>
        <span id="samples" style="display:contents"></span>
      </div>
      <div class="controls-row">
        <label class="arch-field">
          <span id="archLabel"></span>
          <select id="archSel" class="arch-select"></select>
        </label>
        <button id="analyzeBtn" class="btn-primary"></button>
        <button id="tableModeBtn" class="btn-ghost"></button>
        <button id="validJump" type="button" class="valid-jump" style="display:none"></button>
      </div>
    </div>
    <div id="validation" style="display:none"></div>
    <div id="tableMode" style="display:none"></div>
    <div id="empty" class="empty-state">
      <div class="empty-pips">
        <div></div><div></div><div></div><div></div><div></div>
      </div>
      <div id="emptyT" class="empty-title"></div>
      <div id="emptyX" class="empty-text"></div>
    </div>
  </div>

  <!-- Informe: one scrolling report — verdict, then the why (dials), then what to do -->
  <div id="tab-informe" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-informe">
    <div id="verdict"></div>
    <div id="power" class="panel power-panel"></div>
    <div id="tips" class="stack-16">
      <div id="tipsMain" class="panel panel-pad-lg"></div>
      <div id="tipsUp" class="panel panel-pad-lg" aria-live="polite"></div>
      <div id="tipsComp" class="panel panel-pad-lg" aria-live="polite"></div>
    </div>
    <div id="informeEnd"></div>
  </div>

  <!-- Detalles: reference and exploration — insight panels first, the 100-card browser last -->
  <div id="tab-detalles" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-detalles">
    <div id="comp" class="comp-panel"></div>
    <div id="curveWrap" class="curve-wrap"></div>
    <div id="rampPanel" class="panel panel-pad"></div>
    <div id="handPanel" class="panel panel-pad-lg"></div>
    <div class="panel browser-panel">
      <div class="row-between">
        <h2 id="browserT" class="secT"></h2>
        <div class="row-center">
          <span id="groupByLbl" class="lbl-muted"></span>
          <div class="seg-toggle-sm">
            <button id="gtBtn"></button>
            <button id="gcBtn"></button>
          </div>
        </div>
      </div>
      <div id="groups" class="groups"></div>
    </div>
  </div>

  <div id="tab-pod" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-pod">
    <div id="podPanel"></div>
  </div>

  <div id="tab-guide" class="tab-pane" role="tabpanel" aria-labelledby="tabbtn-guide">
    <div class="panel clip">
      <h2 id="guideT" class="secT secT-lg guide-title"></h2>
      <div id="guideBody"></div>
    </div>
  </div>
</main>
<div id="srStatus" class="vh" aria-live="polite"></div>
<div id="footer" class="footer mono"></div>
<div id="howModal" class="modal-backdrop">
  <div id="howBody" class="modal-body" role="dialog" aria-modal="true" aria-labelledby="howTitle"></div>
</div>
<div id="textPop" class="text-pop" role="tooltip" aria-live="polite"></div>
<div id="popover" class="card-pop" aria-hidden="true"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
